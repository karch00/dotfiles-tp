# Configure default programs here

$terminal = kitty ~
$fileTUI = kitty spf
$fileGUI = thunar
$menu = rofi -show drun
$spotify = spotify --disable-features=AcceleratedVideoEncoder,ColorCorrectRendering,CalculateNativeWinOcclusion --disable-gpu-compositing --disable-color-management --disable-gpu-sandbox
$browser = librewolf
$mail = betterbird
$notes = obsidian
$discord = vesktop --disable-features=AcceleratedVideoEncoder,ColorCorrectRendering,UseChromeOSDirectVideoDecoder --disable-gpu-compositing --disable-color-management
$editor = zeditor
$obsidian = obsidian
$logout = pidof wlogout || wlogout
$colorpicker = hyprpicker -a
